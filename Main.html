<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hasta Tattva AR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi&family=Mukta:wght@400;600;700&display=swap">
<style>
  /* Full-screen camera with a canvas overlay; intro sheet and finger legend float above it */
  :root {
    --ink: #F7EFE2;
    --ink-dim: #CDBFA8;
    --panel: rgba(26, 18, 12, 0.82);
    --line: rgba(247, 239, 226, 0.18);
    --accent: #E8A33C;
    --sky: #7B61D6;   --sky-ink: #FFFFFF;
    --air: #3F8FC9;   --air-ink: #FFFFFF;
    --fire: #D9531E;  --fire-ink: #FFFFFF;
    --water: #179AAE; --water-ink: #FFFFFF;
    --earth: #B98320; --earth-ink: #FFFFFF;
    --display: 'Tiro Devanagari Hindi', 'Noto Serif Devanagari', serif;
    --body: 'Mukta', 'Noto Sans Devanagari', system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: #120C08; color: var(--ink); font-family: var(--body); overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  video, canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  video { object-fit: cover; }
  video.mirror { transform: scaleX(-1); }

  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 5;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px));
    background: linear-gradient(rgba(18,12,8,0.75), rgba(18,12,8,0));
  }
  .brand { font-family: var(--display); font-size: 22px; line-height: 1.1; }
  .brand small { display: block; font-family: var(--body); font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--ink-dim); }
  .iconbtn {
    min-width: 44px; height: 44px; padding: 0 14px; border-radius: 22px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    font: 600 15px var(--body); display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
  }
  .iconbtn:focus-visible, .start:focus-visible, .chip:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .status {
    position: fixed; left: 50%; transform: translateX(-50%); z-index: 5;
    top: calc(env(safe-area-inset-top, 0px) + 78px);
    padding: 8px 16px; border-radius: 20px; background: var(--panel); border: 1px solid var(--line);
    font-size: 15px; white-space: nowrap; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis;
  }

  .legend {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 14px) max(16px, env(safe-area-inset-left, 0px));
    background: linear-gradient(rgba(18,12,8,0), rgba(18,12,8,0.85) 30%);
    display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
  }
  .legend::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; display: flex; align-items: center; gap: 8px; min-height: 44px;
    padding: 6px 14px 6px 6px; border-radius: 24px; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); font: 600 15px var(--body); cursor: pointer;
  }
  .chip[aria-pressed="true"] { border-color: var(--accent); background: rgba(232,163,60,0.22); }
  .dot { width: 30px; height: 30px; border-radius: 15px; display: grid; place-items: center; font-weight: 700; font-size: 15px; }

  .intro {
    position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
    padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px));
    background: #120C08;
    overflow-y: auto;
  }
  .card { width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 18px; }
  .card h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 40px; line-height: 1.2; text-wrap: balance; color: var(--accent); }
  .card p { margin: 0; font-size: 18px; line-height: 1.5; color: var(--ink-dim); }
  .map { display: flex; flex-direction: column; gap: 10px; }
  .row { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; align-items: start; padding: 10px 0; border-top: 1px solid var(--line); }
  .row b { display: block; font-size: 18px; }
  .row span { font-size: 15px; color: var(--ink-dim); }
  .start {
    height: 56px; border-radius: 28px; border: 0; background: var(--accent); color: #1E140A;
    font: 700 19px var(--body); cursor: pointer;
  }
  .note { font-size: 13px !important; }
  .err { color: #FFB4A0 !important; }
</style>
</head>
<body>
<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="overlay"></canvas>
</div>

<div class="topbar">
  <div class="brand">हस्त तत्व AR<small>Live palm map</small></div>
  <button class="iconbtn" id="flip" type="button" aria-label="Switch camera">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h3l2-3h8l2 3h3v12H3z"/><path d="M9 13a3 3 0 0 0 5.5 1.5M15 11a3 3 0 0 0-5.5-1.5"/><path d="M14.5 15.5V14H16M9.5 8.5V10H8"/></svg>
    कैमरा
  </button>
</div>
<div class="status" id="status" hidden></div>
<div class="legend" id="legend"></div>

<div class="intro" id="intro">
  <div class="card">
    <h1>हथेली में पंचतत्व और चक्र</h1>
    <p>कैमरे के सामने अपनी हथेली खोलें। हर उंगली पर उसका तत्व, चक्र और जुड़े अंग दिखाई देंगे।</p>
    <div class="map" id="introMap"></div>
    <button class="start" id="start" type="button">कैमरा शुरू करें · Start camera</button>
    <p class="note" id="introNote">पहली बार हैंड-ट्रैकिंग मॉडल लोड होने में कुछ सेकंड लगते हैं। वीडियो आपके फ़ोन पर ही प्रोसेस होता है, कहीं भेजा नहीं जाता। · v5</p>
  </div>
</div>

<script type="module">
import { FilesetResolver, HandLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const FINGERS = [
  { n: 1, tip: 4,  base: 3,  chain: [1,2,3,4],     color: '--sky',   name: 'अंगूठा',  en: 'Thumb',  el: 'आकाश तत्व', elEn: 'Sky',   chakra: 'मूलाधार चक्र',           organs: 'दोनों कान' },
  { n: 2, tip: 8,  base: 7,  chain: [5,6,7,8],     color: '--earth', name: 'तर्जनी',  en: 'Index',  el: 'पृथ्वी तत्व', elEn: 'Earth', chakra: 'नाभि चक्र (मणिपुर)',     organs: 'नाभि, दोनों नासिका' },
  { n: 3, tip: 12, base: 11, chain: [9,10,11,12],  color: '--water', name: 'मध्यमा',  en: 'Middle', el: 'जल तत्व',   elEn: 'Water', chakra: 'स्वाधिष्ठान चक्र',       organs: 'होंठ, जीभ, किडनी, प्रजनन अंग' },
  { n: 4, tip: 16, base: 15, chain: [13,14,15,16], color: '--fire',  name: 'अनामिका', en: 'Ring',   el: 'अग्नि तत्व', elEn: 'Fire',  chakra: 'हृदय चक्र (अनाहत)',      organs: 'दोनों आंखें' },
  { n: 5, tip: 20, base: 19, chain: [17,18,19,20], color: '--air',   name: 'कनिष्ठा', en: 'Little', el: 'वायु तत्व',  elEn: 'Air',   chakra: 'विशुद्धि चक्र',          organs: 'त्वचा' },
];
const PALM = [[0,1],[0,5],[5,9],[9,13],[13,17],[0,17]];
const CENTER = { n: 6, color: '--earth', name: 'हथेली का केंद्र', en: 'Palm centre', el: 'पृथ्वी तत्व', elEn: 'Earth', chakra: 'मणिपुर चक्र', organs: '' };

const css = getComputedStyle(document.documentElement);
FINGERS.forEach(f => f.hex = css.getPropertyValue(f.color).trim());
CENTER.hex = css.getPropertyValue(CENTER.color).trim();

const video = document.getElementById('video');
const canvas = document.getElementById('overlay');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const legend = document.getElementById('legend');
const introMap = document.getElementById('introMap');
const introNote = document.getElementById('introNote');
const startBtn = document.getElementById('start');

let landmarker = null, stream = null, facing = 'user', focus = null;
let lastVideoTime = -1;
const smooth = {}; // label positions, per hand+finger

// Intro list and legend chips
[...FINGERS, CENTER].forEach(f => {
  const row = document.createElement('div');
  row.className = 'row';
  const mark = f === CENTER ? '◎' : f.n;
  row.innerHTML = `<div class="dot" style="background:${f.hex}">${mark}</div><div><b>${f.name} · ${f.el}</b><span>${f.chakra}${f.organs ? ' — ' + f.organs : ''}</span></div>`;
  introMap.appendChild(row);

  const chip = document.createElement('button');
  chip.type = 'button'; chip.className = 'chip'; chip.id = 'chip' + f.n;
  chip.setAttribute('aria-pressed', 'false');
  chip.innerHTML = `<span class="dot" style="background:${f.hex}">${mark}</span>${f === CENTER ? 'केंद्र' : f.name} · ${f.elEn}`;
  chip.addEventListener('click', () => {
    focus = focus === f.n ? null : f.n;
    document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c.id === 'chip' + focus)));
  });
  legend.appendChild(chip);
});

function setStatus(t) { statusEl.textContent = t || ''; statusEl.hidden = !t; }

async function loadModel() {
  const files = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const opts = (delegate) => ({
    baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task", delegate },
    runningMode: "VIDEO", numHands: 2,
    minHandDetectionConfidence: 0.5, minHandPresenceConfidence: 0.5, minTrackingConfidence: 0.5,
  });
  // CPU first: the GPU path can hang silently on some Android phones
  try { return await withTimeout(HandLandmarker.createFromOptions(files, opts("CPU")), 45000, 'model'); }
  catch (e) {
    if (e && e.message === 'timeout:model') throw e;
    return await withTimeout(HandLandmarker.createFromOptions(files, opts("GPU")), 30000, 'model');
  }
}

function withTimeout(p, ms, tag) {
  return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout:' + tag)), ms))]);
}

async function startCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
  video.srcObject = null;
  lastVideoTime = -1;
  // iPhones often need an exact facingMode for the rear camera; fall back to a looser request
  const tries = [
    { video: { facingMode: { exact: facing }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false },
    { video: { facingMode: facing }, audio: false },
  ];
  let lastErr;
  for (const c of tries) {
    try { stream = await navigator.mediaDevices.getUserMedia(c); break; }
    catch (e) { lastErr = e; if (e && e.name === 'NotAllowedError') break; }
  }
  if (!stream) throw lastErr;
  video.srcObject = stream;
  video.classList.toggle('mirror', facing === 'user');
  // Don't block on play(): some browsers never resolve it
  video.play().catch(() => {});
  if (video.readyState < 1) {
    await new Promise(res => { video.onloadedmetadata = res; setTimeout(res, 4000); });
  }
  video.play().catch(() => {});
}

startBtn.addEventListener('click', async () => {
  startBtn.disabled = true;
  startBtn.textContent = 'लोड हो रहा है…';
  try {
    if (!navigator.mediaDevices?.getUserMedia) throw new Error('nocam');
    // 1. camera first, so the user sees themselves while the model loads
    await withTimeout(startCamera(), 15000, 'camera');
    document.getElementById('intro').hidden = true;
    setStatus('हैंड-ट्रैकिंग मॉडल लोड हो रहा है…');
    // 2. then the model
    landmarker = await loadModel();
    setStatus('');
    requestAnimationFrame(loop);
  } catch (e) {
    console.error(e);
    document.getElementById('intro').hidden = false;
    setStatus('');
    startBtn.disabled = false;
    startBtn.textContent = 'फिर से कोशिश करें · Try again';
    introNote.classList.add('err');
    const msg = String(e && (e.message || e.name) || e);
    introNote.textContent =
      (e && e.name === 'NotAllowedError') ? 'कैमरा की अनुमति नहीं मिली। ब्राउज़र सेटिंग्स में कैमरा अनुमति दें और फिर से कोशिश करें।'
      : msg === 'nocam' ? 'यह ब्राउज़र कैमरा नहीं खोल सकता। पेज को Chrome में https लिंक से खोलें।'
      : msg === 'timeout:camera' ? 'कैमरा शुरू नहीं हुआ। दूसरे ऐप में कैमरा बंद करें और पेज रीलोड करें।'
      : msg === 'timeout:model' ? 'मॉडल लोड होने में बहुत समय लगा। Wi-Fi से जुड़कर पेज रीलोड करें।'
      : 'शुरू नहीं हो सका (' + msg.slice(0, 80) + ')। पेज रीलोड करके फिर कोशिश करें।';
  }
});

document.getElementById('flip').addEventListener('click', async () => {
  facing = facing === 'user' ? 'environment' : 'user';
  for (const k in smooth) delete smooth[k];
  try { await startCamera(); }
  catch (e) {
    setStatus('यह कैमरा नहीं खुल सका (' + ((e && e.name) || 'error') + ')');
    facing = facing === 'user' ? 'environment' : 'user';
    try { await startCamera(); } catch {}
  }
});

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(innerWidth * dpr);
  canvas.height = Math.round(innerHeight * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize); resize();

// Map normalized landmark to screen px, matching object-fit: cover and mirroring
function mapper() {
  const cw = innerWidth, ch = innerHeight, vw = video.videoWidth || 1, vh = video.videoHeight || 1;
  const s = Math.max(cw / vw, ch / vh);
  const ox = (cw - vw * s) / 2, oy = (ch - vh * s) / 2;
  const mirror = facing === 'user';
  return (p) => {
    let x = p.x * vw * s + ox;
    if (mirror) x = cw - x;
    return { x, y: p.y * vh * s + oy };
  };
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function drawLabel(f, tip, dir, key, handScale) {
  const cw = innerWidth, ch = innerHeight;
  const big = focus === f.n;
  const fs = Math.max(12, Math.min(16, handScale * 0.09)) * (big ? 1.25 : 1);
  const pad = fs * 0.6;
  const lines = [
    { t: `${f.name} · ${f.el}`, font: `700 ${fs}px Mukta, sans-serif`, c: '#FFFFFF' },
    { t: f.chakra, font: `600 ${fs * 0.92}px Mukta, sans-serif`, c: '#FFE7BF' },
    { t: f.organs, font: `400 ${fs * 0.88}px Mukta, sans-serif`, c: '#E9DDCB' },
  ].filter(l => l.t);
  let w = 0;
  lines.forEach(l => { ctx.font = l.font; w = Math.max(w, ctx.measureText(l.t).width); });
  w += pad * 2 + 10;
  const lh = fs * 1.3, h = lh * lines.length + pad * 1.4;

  const dist = handScale * 0.35 + 28;
  let tx = tip.x + dir.x * dist - w / 2;
  let ty = tip.y + dir.y * dist - h / 2;
  tx = Math.max(8, Math.min(cw - w - 8, tx));
  ty = Math.max(70, Math.min(ch - h - 80, ty));

  const prev = smooth[key];
  const k = 0.35;
  const pos = prev ? { x: prev.x + (tx - prev.x) * k, y: prev.y + (ty - prev.y) * k } : { x: tx, y: ty };
  smooth[key] = pos;

  // leader line
  ctx.strokeStyle = f.hex; ctx.lineWidth = 2; ctx.globalAlpha = 0.9;
  ctx.beginPath(); ctx.moveTo(tip.x, tip.y);
  ctx.lineTo(Math.max(pos.x, Math.min(pos.x + w, tip.x)), Math.max(pos.y, Math.min(pos.y + h, tip.y)));
  ctx.stroke(); ctx.globalAlpha = 1;

  roundRect(pos.x, pos.y, w, h, 12);
  ctx.fillStyle = 'rgba(26,18,12,0.86)'; ctx.fill();
  ctx.lineWidth = big ? 3 : 1.5; ctx.strokeStyle = f.hex; ctx.stroke();
  ctx.fillStyle = f.hex; roundRect(pos.x, pos.y, 6, h, 3); ctx.fill();

  ctx.textBaseline = 'top';
  lines.forEach((l, i) => {
    ctx.font = l.font; ctx.fillStyle = l.c;
    ctx.fillText(l.t, pos.x + pad + 6, pos.y + pad * 0.7 + i * lh);
  });
}

function drawHand(lms, hi) {
  const m = mapper();
  const P = lms.map(m);
  const handScale = Math.hypot(P[0].x - P[9].x, P[0].y - P[9].y) * 2;

  // palm outline
  ctx.strokeStyle = 'rgba(247,239,226,0.55)'; ctx.lineWidth = 2;
  PALM.forEach(([a, b]) => { ctx.beginPath(); ctx.moveTo(P[a].x, P[a].y); ctx.lineTo(P[b].x, P[b].y); ctx.stroke(); });

  // fingers in element colors
  FINGERS.forEach(f => {
    const dim = focus && focus !== f.n;
    ctx.globalAlpha = dim ? 0.3 : 0.95;
    ctx.strokeStyle = f.hex; ctx.lineWidth = Math.max(4, handScale * 0.035); ctx.lineCap = 'round';
    ctx.beginPath();
    f.chain.forEach((idx, i) => i ? ctx.lineTo(P[idx].x, P[idx].y) : ctx.moveTo(P[idx].x, P[idx].y));
    ctx.stroke();
    ctx.globalAlpha = 1;
  });

  // labels (focused finger last, so it sits on top)
  // palm centre: Manipura chakra, Earth element
  const ids = [0, 5, 9, 13, 17];
  const C = { x: ids.reduce((a, i) => a + P[i].x, 0) / 5, y: ids.reduce((a, i) => a + P[i].y, 0) / 5 };
  const cDim = focus && focus !== CENTER.n;
  const cr = Math.max(14, handScale * 0.08);
  ctx.globalAlpha = cDim ? 0.4 : 1;
  ctx.beginPath(); ctx.arc(C.x, C.y, cr * 1.55, 0, Math.PI * 2);
  ctx.lineWidth = 2; ctx.strokeStyle = CENTER.hex; ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);
  ctx.beginPath(); ctx.arc(C.x, C.y, cr, 0, Math.PI * 2);
  ctx.fillStyle = CENTER.hex; ctx.fill(); ctx.strokeStyle = '#FFFFFF'; ctx.stroke();
  ctx.fillStyle = '#FFFFFF'; ctx.font = `700 ${cr * 0.75}px Mukta, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('मणि', C.x, C.y + 1);
  ctx.textAlign = 'start'; ctx.globalAlpha = 1;
  if (!focus || focus === CENTER.n) {
    let dx = C.x - P[9].x, dy = C.y - P[9].y; const L = Math.hypot(dx, dy) || 1;
    drawLabel(CENTER, C, { x: dx / L, y: dy / L }, hi + '-c', handScale);
  }

  FINGERS.forEach(f => {
    if (focus && focus !== f.n) return;
    const tip = P[f.tip], b = P[f.base];
    let dx = tip.x - b.x, dy = tip.y - b.y; const L = Math.hypot(dx, dy) || 1;
    drawLabel(f, tip, { x: dx / L, y: dy / L }, hi + '-' + f.n, handScale);
  });

  // fingertip badges
  FINGERS.forEach(f => {
    const dim = focus && focus !== f.n;
    const t = P[f.tip], r = Math.max(13, handScale * 0.06);
    ctx.globalAlpha = dim ? 0.45 : 1;
    ctx.beginPath(); ctx.arc(t.x, t.y, r, 0, Math.PI * 2);
    ctx.fillStyle = f.hex; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#FFFFFF'; ctx.stroke();
    ctx.fillStyle = '#FFFFFF'; ctx.font = `700 ${r * 1.1}px Mukta, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(f.n), t.x, t.y + 1);
    ctx.textAlign = 'start'; ctx.globalAlpha = 1;
  });
}

function loop() {
  requestAnimationFrame(loop);
  if (!landmarker || video.readyState < 2) return;
  if (video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;

  const res = landmarker.detectForVideo(video, performance.now());
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  const hands = res.landmarks || [];
  if (!hands.length) {
    setStatus('अपनी खुली हथेली कैमरे के सामने रखें');
    for (const k in smooth) delete smooth[k];
    return;
  }
  setStatus(focus ? '' : 'किसी उंगली पर ध्यान के लिए नीचे टैप करें');
  hands.forEach((lms, i) => drawHand(lms, i));
}
</script>
</body>
</html>
